name: Générer les signaux pour les Cryptomonnaies

on:
  schedule:
    - cron: '0 * * * *' # Chaque heure, tous les jours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Cloner le repo
        uses: actions/checkout@v3

      - name: Installer Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Installer les dépendances
        run: npm install axios luxon dotenv

      - name: Exécuter le script de génération pour les cryptomonnaies
        run: node scripts/generate-signals.js cryptos
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}

      - name: Commit et push des signaux
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/signals.json
          git diff --quiet --cached || git commit -m "Mise à jour automatique des signaux pour les cryptomonnaies"
          git push
