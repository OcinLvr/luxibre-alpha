<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Luxibre Alpha – Dashboard</title>
  <meta name="description" content="Tableau de bord dynamique Luxibre Alpha : signaux boursiers, alertes, prévisions IA, réservé aux utilisateurs premium." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tailwindcss/forms@0.5.6/dist/forms.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chart.js/dist/Chart.min.css">
  <link rel="stylesheet" href="/styles/dashboard.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen">

  <!-- En-tête -->
  <header class="bg-gray-800 p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold">📊 Luxibre Alpha</h1>
    <a href="/pricing.html" class="text-blue-400 hover:text-blue-300 font-medium">Passer Premium</a>
  </header>

  <!-- Notification Premium -->
  <div id="premiumNotice" class="text-center text-yellow-400 mt-4 px-4 hidden"></div>

  <!-- Conteneur principal -->
  <main id="signalsContainer" class="p-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    <!-- Les cartes sont injectées ici par dashboard.js -->
  </main>

  <!-- Modale graphique -->
  <div id="bigChartModal" class="fixed inset-0 bg-black bg-opacity-80 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-gray-800 p-6 rounded-lg w-full max-w-4xl relative max-h-[90vh] overflow-auto">
      <h2 id="bigChartTitle" class="text-xl font-semibold mb-4 text-center"></h2>
      <canvas id="bigChartCanvas" class="w-full h-64 mb-4"></canvas>
      <div id="predictionsContainer" class="text-sm text-gray-300 mb-4 text-center"></div>
      <div class="flex justify-end gap-2">
        <button id="resetZoomBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded">Réinitialiser Zoom</button>
        <button id="exportBigChartBtn" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded">Exporter</button>
        <button id="closeBigChartBtn" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded">Fermer</button>
      </div>
    </div>
  </div>

  <!-- Chargement Supabase -->
  <script type="module" src="JS/supabase.js"></script>

  <!-- Script principal -->
  <script type="module">
    import { renderSignals } from 'JS/dashboard.js';
    renderSignals(); // attend que supabase.js ait défini isPremiumPromise
  </script>
</body>
</html>
