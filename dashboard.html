<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luxibre Alpha - Tableau de bord</title>
    <meta name="description" content="Suivez en temps réel les meilleurs signaux d'investissement grâce à notre IA. Recommandations d'achat, vente ou conservation pour tous les actifs." />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="script.js"></script>
    <style>
      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
      }

      .blurred::before {
        content: "";
        position: absolute;
        inset: 0;
        backdrop-filter: blur(6px);
        background-color: rgba(255, 255, 255, 0.4);
        z-index: 10;
        border-radius: inherit;
      }

      .card.blurred::after {
        content: "Débloquez avec l'offre Premium";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 20;
        font-weight: bold;
        color: #1e40af;
        background: rgba(255, 255, 255, 0.85);
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
      }

      .badge-premium {
        background-color: #facc15;
        color: #1e293b;
        padding: 0.25rem 0.5rem;
        font-size: 0.75rem;
        font-weight: bold;
        border-radius: 0.25rem;
        margin-left: 0.5rem;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-800">
    <header class="bg-white shadow sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-blue-700">Luxibre Alpha</h1>
        <div id="user-status" class="text-sm text-gray-500">
          <!-- Dynamically replaced -->
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
      <h2 class="text-xl sm:text-2xl font-semibold mb-4 text-center">Tableau de bord</h2>

      <div id="signals-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Les cartes seront injectées ici -->
      </div>
    </main>

    <script>
      const isPremiumUser = localStorage.getItem("isPremium") === "true";

      // Affichage du statut utilisateur
      const userStatus = document.getElementById("user-status");
      userStatus.innerHTML = isPremiumUser
        ? `<span class="text-green-600 font-semibold">Statut : Premium <span class="badge-premium">⭐</span></span>`
        : `Statut : Gratuit - <a href="/pricing.html" class="text-blue-600 underline">Passer Premium</a>`;

      // Chargement des signaux
      fetch("data/signals.json")
        .then((res) => res.json())
        .then((signals) => {
          const container = document.getElementById("signals-container");

          signals.forEach((signal) => {
            const card = document.createElement("div");
            card.className =
              "relative card bg-white rounded-lg border p-6 shadow-sm transition-transform duration-300";

            if (!isPremiumUser) {
              card.classList.add("blurred");
            }

            const recommendationColor =
              signal.recommendation === "acheter"
                ? "text-green-600"
                : signal.recommendation === "vendre"
                ? "text-red-600"
                : "text-yellow-600";

            card.innerHTML = `
              <h3 class="text-lg font-semibold mb-1">${signal.name}</h3>
              <p class="text-sm text-gray-500 mb-2">${signal.symbol}</p>
              <p class="font-medium">Recommandation :
                <span class="${recommendationColor}">${signal.recommendation.toUpperCase()}</span>
              </p>
              <p class="text-sm mt-2">Performance 30j : <strong>${signal.performance30j}</strong></p>
              <div class="mt-4">
                <canvas id="chart-${signal.symbol}" width="400" height="200"></canvas>
              </div>
              <div class="mt-3 text-sm text-gray-500">
                Prévision : 1j <strong>${signal.prediction["1j"]}</strong> |
                3j <strong>${signal.prediction["3j"]}</strong> |
                7j <strong>${signal.prediction["7j"]}</strong>
              </div>
            `;

            container.appendChild(card);

            // Génération du graphique simulé (à remplacer par des données réelles si dispo)
            const ctx = card.querySelector(`#chart-${signal.symbol}`).getContext("2d");
            new Chart(ctx, {
              type: "line",
              data: {
                labels: Array.from({ length: 7 }, (_, i) => `J-${6 - i}`),
                datasets: [
                  {
                    label: "Prix",
                    data: signal.history || [100, 102, 104, 103, 105, 107, 106],
                    borderColor: "#2563eb",
                    fill: false,
                    tension: 0.3,
                  },
                ],
              },
              options: {
                responsive: true,
                plugins: {
                  legend: { display: false },
                },
                scales: {
                  x: { display: false },
                  y: { display: false },
                },
              },
            });
          });
        });
    </script>
  </body>
</html>
