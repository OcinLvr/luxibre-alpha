<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luxibre Alpha - Dashboard Moderne</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@1.25.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.0.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@1.2.1/dist/chartjs-plugin-zoom.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <style>
    :root {
      --primary-color: #22c55e;
      --secondary-color: #1e293b;
      --text-color: #f1f5f9;
      --accent-color: #86efac;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: var(--text-color);
      margin: 0;
    }
    .modal-open { overflow: hidden; }
    #bigChartModal {
      display: none;
      position: fixed;
      inset:0; background: rgba(0,0,0,0.5);
      justify-content:center; align-items:center;
    }
    #bigChartContent {
      background: #1e293b; padding:1rem; border-radius:0.5rem;
      max-width:90%; max-height:90%; overflow:auto;
    }
  </style>
</head>
<body>
  <div id="headerContainer"></div>

  <nav class="dashboard-nav flex gap-2 sm:justify-center p-4 bg-gray-800">
    <select id="signalFilter" class="..."> <!-- conservé visible abrégé -->
      <!-- options -->
    </select>
    <select id="typeFilter" class="...">
      <!-- options -->
    </select>
  </nav>

  <main class="container mx-auto p-4">
    <div id="premiumNotice" class="notice hidden"></div>
    <div id="signalsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    <!-- sections performance & témoignages inchangées -->
  </main>

  <div id="bigChartModal" role="dialog" aria-modal="true" aria-labelledby="bigChartTitle">
    <div id="bigChartContent">
      <div class="flex justify-between items-center mb-4">
        <h3 id="bigChartTitle" class="text-xl font-bold"></h3>
        <button id="closeBigChartBtn" aria-label="Fermer"><i class="fas fa-times text-white"></i></button>
      </div>
      <canvas id="bigChartCanvas" style="max-height:400px;"></canvas>
      <div id="predictionsContainer" class="mt-4 text-sm"></div>
      <div class="flex gap-2 mt-4">
        <button id="resetZoomBtn" class="btn">Réinitialiser Zoom</button>
        <button id="exportBigChartBtn" class="btn">Exporter</button>
      </div>
    </div>
  </div>

  <footer class="py-10 bg-gray-100 mt-16 text-center text-sm text-gray-600">
    &copy; 2025 <span class="font-semibold text-green-600">Luxibre Alpha</span>. Tous droits réservés. |
    <a href="/legal/mentions-legales.html">Mentions légales</a> |
    <a href="/legal/cgu.html">CGU</a> |
    <a href="/legal/rgpd.html">RGPD</a>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Chargement du header commun
      fetch('/header.html')
        .then(r => r.text())
        .then(html => document.getElementById('headerContainer').innerHTML = html)
        .catch(e => console.error("Erreur chargement header :", e));

      const modal = document.getElementById('bigChartModal');
      document.getElementById('closeBigChartBtn')
        .addEventListener('click', closeBigChart);
      document.addEventListener('keydown', e => { if (e.key === 'Escape') closeBigChart(); });

      async function closeBigChart() {
        modal.classList.remove('flex');
        modal.style.display = 'none';
      }

      function exportChartById(chartId) {
        window.isPremiumUser().then(isPremium => {
          if (!isPremium) {
            alert("Fonction réservée aux abonnés premium.");
            return;
          }
          html2canvas(document.getElementById(chartId)).then(canvas => {
            const link = document.createElement('a');
            link.download = 'chart.png';
            link.href = canvas.toDataURL();
            link.click();
          });
        });
      }
      window.exportChart = exportChartById;

      async function openBigChart(signal) {
        const modal = document.getElementById('bigChartModal');
        if (signal.premium && !await window.isPremiumUser()) {
          alert("Accès réservé aux abonnés premium.");
          return;
        }

        document.getElementById('bigChartTitle').textContent = signal.name;
        const ctx = document.getElementById('bigChartCanvas').getContext('2d');
        if (window.bigChartInstance) window.bigChartInstance.destroy();

        window.bigChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: signal.history.map((_, i) => `J-${signal.history.length - i}`),
            datasets: [{ label: signal.name, data: signal.history, borderColor:'#3b82f6', backgroundColor:'rgba(59,130,246,0.1)', tension:0.4 }]
          },
          options: { plugins:{ zoom:{ zoom:{ wheel:{enabled:true}, pinch:{enabled:true}, mode:'xy' }, pan:{ enabled:true, mode:'xy', modifierKey:'ctrl' } } } }
        });

        const predDiv = document.getElementById('predictionsContainer');
        if (await window.isPremiumUser() && signal.predictions) {
          predDiv.innerHTML = `
            <h4 class="font-semibold mb-2">Prévisions de prix :</h4>
            <ul class="list-disc list-inside space-y-1">
              <li>1 jour : €${signal.predictions["1d"]}</li>
              <li>3 jours : €${signal.predictions["3d"]}</li>
              <li>7 jours : €${signal.predictions["7d"]}</li>
            </ul>`;
        } else {
          predDiv.innerHTML = signal.premium
            ? '<p>Prédictions réservées au premium.</p>'
            : '<p>Aucune prédiction disponible.</p>';
        }

        modal.style.display = 'flex';
        modal.classList.add('modal-open');
      }

      async function renderSignals() {
        const data = await fetch('data/signals.json').then(r => r.json()).catch(e => { console.error(e); return null; });
        if (!data) return;

        const isPremium = await window.isPremiumUser();
        const { data: { user } } = await supabase.auth.getUser();
        const container = document.getElementById('signalsContainer');
        container.innerHTML = '';
        let premiumLocked = false;

        for (const category of ['achat', 'vente', 'conservation']) {
          (data[category] || []).sort((a, b) => a.premium - b.premium).forEach(async signal => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.category = category;
            card.dataset.type = signal.type;

            const locked = signal.premium && !isPremium;
            if (locked) { card.classList.add('blur'); premiumLocked = true; }

            const updated = luxon.DateTime.fromISO(signal.updated).toLocaleString(luxon.DateTime.DATETIME_MED);

            const followed = user ? await window.isFollowed(signal) : false;
            const btnFollow = user
              ? `<button class="follow-btn" onclick='toggleFollow(${JSON.stringify(signal).replace(/"/g, '&quot;')})'>${followed ? 'Ne plus suivre' : 'Suivre'}</button>`
              : '<p>Connectez-vous pour suivre.</p>';

            card.innerHTML = `
              ${signal.premium ? '<div class="premium-badge">Premium</div>' : ''}
              ${locked ? '<button onclick="window.location.href=\'/pricing.html\'" class="upgrade">Devenez Premium</button>' : ''}
              <div class="card-content">
                <h3>${signal.name}</h3>
                <p>Prix actuel : $${signal.price.toFixed(2)}</p>
                <p>Performance 30j : ${signal.performance30j}%</p>
                <p>Recommandation : <span>${signal.recommendation}</span></p>
                <p>Dernière mise à jour : ${updated}</p>
                <div class="chart-container">
                  <canvas id="chart-${category}-${data[category].indexOf(signal)}" width="300" height="150"></canvas>
                  <button class="export-btn" onclick="exportChart('chart-${category}-${data[category].indexOf(signal)}')">Exporter</button>
                </div>
                ${btnFollow}
              </div>`;

            container.appendChild(card);

            if (!locked) {
              const ctx = card.querySelector('canvas').getContext('2d');
              new Chart(ctx, {
                type: 'line',
                data: {
                  labels: signal.history.map((_,i) => `J-${signal.history.length - i}`),
                  datasets: [{ data: signal.history, borderColor:'#3b82f6', backgroundColor:'rgba(59,130,246,0.1)', tension:0.4 }]
                },
                options:{},
              });

              card.querySelector('.chart-container').addEventListener('click', e => {
                if (!e.target.classList.contains('export-btn')) openBigChart(signal);
              });
            }
          });
        }

        if (premiumLocked && !isPremium) {
          const notice = document.getElementById('premiumNotice');
          notice.classList.remove('hidden');
          notice.textContent = "Certains signaux sont réservés aux abonnés premium. Abonnez-vous pour tout débloquer.";
        }
      }

      ['signalFilter','typeFilter'].forEach(id =>
        document.getElementById(id).addEventListener('change', () => {
          document.querySelectorAll('.card').forEach(card => {
            const matchFilter = (document.getElementById('signalFilter').value === 'all' || card.dataset.category === document.getElementById('signalFilter').value)
              && (document.getElementById('typeFilter').value === 'all' || card.dataset.type === document.getElementById('typeFilter').value);
            card.style.display = matchFilter ? '' : 'none';
          });
        })
      );

      renderSignals();
    });
  </script>
</body>
</html>
