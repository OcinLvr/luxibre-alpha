<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luxibre Alpha - Dashboard</title>
  <link rel="icon" href="favicon.ico">
  <!-- Chart.js + Chart.js Zoom Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.umd.min.js"></script>
  <!-- Luxon pour dates -->
  <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
  <!-- html2canvas pour export PNG -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    :root {
      --primary-color: #22c55e;
      --secondary-color: #1e293b;
      --text-color: #f1f5f9;
      --accent-color: #86efac;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: var(--text-color);
      margin: 0;
    }
    .notice {
      background: #dcfce7;
      color: #166534;
      border-left: 5px solid var(--primary-color);
      padding: 1rem 1.5rem;
      border-radius: 0.75rem;
      margin-bottom: 2rem;
      font-weight: 600;
      text-align: center;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .notice ul {
      margin: 0.5rem 0 0.5rem 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
    }
    .notice li {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 500;
    }
    .notice a {
      margin-top: 8px;
      display: inline-block;
    }
    .card {
      background: var(--secondary-color);
      padding: 1.5rem;
      border-radius: 1rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      min-width: 290px;
      max-width: 370px;
      margin: 0 auto;
      flex: 1 1 320px;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 20px rgba(34,197,94,0.4);
    }
    .card-content {
      position: relative;
      z-index: 1;
    }
    .card.blur .card-content {
      filter: blur(4px);
      pointer-events: none;
      user-select: none;
    }
    .premium-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: gold;
      color: black;
      padding: 0.25rem 0.5rem;
      border-radius: 0.5rem;
      font-size: 0.75rem;
      font-weight: bold;
      z-index: 2;
    }
    .upgrade-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.85);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 2rem;
      text-align: center;
      z-index: 2;
      border: 1px solid rgba(34, 197, 94, 0.5);
      cursor: pointer;
      transition: background 0.3s;
      font-weight: bold;
      font-size: 1rem;
    }
    .upgrade-message:hover {
      background: rgba(34, 197, 94, 0.9);
      color: #fff;
    }
    .recommendation {
      margin-top: 0.8rem;
      font-weight: 700;
      color: #4ade80;
    }
    .chart-container {
      height: 200px;
      margin-top: 1rem;
      background: #0f172a;
      border-radius: 0.6rem;
      cursor: pointer;
      position: relative;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: box-shadow 0.3s ease;
    }
    .chart-container:hover {
      box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
    }
    .performance-badge {
      display: inline-block;
      min-width: 56px;
      text-align: center;
      border-radius: 1rem;
      font-weight: 600;
      margin-left: 0.5rem;
      padding: 0.15rem 0.75rem;
      font-size: 1rem;
    }
    .performance-positive {
      background: #22c55e;
      color: #fff;
    }
    .performance-negative {
      background: #f87171;
      color: #fff;
    }
    .export-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      font-weight: 600;
      border-radius: 0.5rem;
      cursor: pointer;
      z-index: 2;
      transition: background 0.3s;
    }
    .export-btn:hover {
      background: #16a34a;
    }
    footer {
      background: var(--secondary-color);
      padding: 1rem;
      text-align: center;
      margin-top: 2rem;
    }
    footer a {
      color: var(--primary-color);
      margin: 0 1rem;
      text-decoration: none;
    }
    /* Modal style for big chart */
    body.modal-open {
      overflow: hidden;
    }
    #bigChartModal {
      position: fixed;
      inset: 0;
      background-color: rgba(15, 23, 42, 0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      overflow-y: auto;
    }
    #bigChartModal.active {
      display: flex;
    }
    #bigChartContent {
      background-color: var(--secondary-color);
      border-radius: 1rem;
      padding: 1.5rem;
      width: 90%;
      max-width: 900px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px var(--primary-color);
      position: relative;
      overflow-y: auto;
    }
    #bigChartHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    #bigChartHeader h3 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent-color);
    }
    #closeBigChartBtn {
      background: transparent;
      border: none;
      color: var(--accent-color);
      font-size: 1.5rem;
      cursor: pointer;
      transition: color 0.3s;
    }
    #closeBigChartBtn:hover {
      color: var(--primary-color);
    }
    #bigChartCanvas {
      flex-grow: 1;
      max-height: 70vh;
      background: #0f172a;
      border-radius: 0.6rem;
    }
    #predictionsContainer {
      margin-top: 1rem;
      padding: 1rem;
      background: #0f172a;
      border-radius: 0.6rem;
    }
    #bigChartActions {
      margin-top: 1rem;
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
    }
    #bigChartActions button {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      font-weight: 600;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.3s;
    }
    #bigChartActions button:hover {
      background: #16a34a;
    }
    /* Loader */
    #loader {
      display: none;
      margin: 2rem auto;
      text-align: center;
    }
    /* Responsive */
    #signalsContainer {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
      align-items: stretch;
      margin-bottom: 2rem;
    }
    @media (max-width: 900px) {
      #signalsContainer {
        gap: 1.25rem;
      }
    }
    @media (max-width: 700px) {
      .card {
        min-width: 90vw;
        max-width: 97vw;
        padding: 1rem;
      }
      #signalsContainer {
        gap: 1rem;
      }
    }
    @media (max-width: 600px) {
      .card {
        min-width: 98vw;
        max-width: 99vw;
        padding: 0.7rem;
      }
    }
    @media (max-width: 480px) {
      .card {
        border-radius: 0.5rem;
        padding: 0.5rem;
      }
      #signalsContainer {
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body class="bg-gray-50">

  <!-- Loader -->
  <div id="loader" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-20" style="display:none">
    <div class="animate-spin rounded-full h-16 w-16 border-4 border-blue-300 border-t-blue-600"></div>
  </div>

  <main class="max-w-5xl mx-auto px-2 py-8">
    <h1 class="text-2xl font-bold mb-6 text-center">Tableau de bord • Luxibre Alpha</h1>

    <div id="premiumNotice" class="mb-4 p-4 rounded-lg bg-yellow-100 border border-yellow-300 text-yellow-800 text-center font-semibold" style="display:none">
      Certains signaux sont réservés aux membres Premium. <a href="#tarifs" class="underline text-blue-700 hover:text-blue-900">Voir nos offres</a>
    </div>

    <div class="mb-6 flex flex-wrap gap-3 justify-center">
      <select id="signalFilter" class="border px-3 py-2 rounded shadow-sm">
        <option value="all">Tous les signaux</option>
        <option value="achat">Achat</option>
        <option value="vente">Vente</option>
        <option value="conservation">Conservation</option>
      </select>
      <select id="typeFilter" class="border px-3 py-2 rounded shadow-sm">
        <option value="all">Tous types</option>
        <option value="crypto">Crypto</option>
        <option value="bourse">Bourse</option>
        <option value="forex">Forex</option>
      </select>
    </div>

    <div id="signalsContainer" class="grid md:grid-cols-2 gap-6"></div>

    <div id="suggest-asset-message" class="mt-10 text-blue-600 text-center text-sm font-medium" style="display:none">
      Un actif manque ? <a href="https://forms.gle/xxxxx" target="_blank" class="underline">Suggérez-nous un ajout !</a>
    </div>
  </main>

  <!-- Modal pour grand graphique -->
  <div id="bigChartModal">
    <div id="bigChartBox" class="relative">
      <button id="closeBigChartBtn" class="absolute right-4 top-4 text-xl text-gray-400 hover:text-red-500" title="Fermer"><i class="fa fa-times"></i></button>
      <div class="p-5 border-b flex flex-col sm:flex-row sm:items-center gap-2">
        <h2 id="bigChartTitle" class="text-lg font-bold flex-1"></h2>
        <div class="flex gap-1 flex-wrap">
          <button class="quick-range-btn" data-range="all">Tout</button>
          <button class="quick-range-btn" data-range="30">30j</button>
          <button class="quick-range-btn" data-range="7">7j</button>
          <button class="quick-range-btn" data-range="1">1j</button>
        </div>
      </div>
      <div class="flex flex-wrap gap-2 px-5 pt-3 pb-1">
        <span class="font-semibold mr-2">Indicateurs :</span>
        <button class="indicator-toggle-btn" data-indicator="rsi">RSI</button>
        <button class="indicator-toggle-btn" data-indicator="macd">MACD</button>
        <!-- Ajoute ici d'autres indicateurs si tu veux -->
      </div>
      <div class="px-5 pt-0" style="height:320px; min-width:280px;">
        <canvas id="bigChartCanvas"></canvas>
      </div>
      <div class="flex gap-2 px-5 pb-3 pt-2">
        <button id="resetZoomBtn" class="bg-gray-200 rounded px-3 py-1 text-sm hover:bg-blue-50"><i class="fa fa-search-minus mr-1"></i>Réinitialiser le zoom</button>
        <button id="exportBigChartBtn" class="bg-blue-500 text-white rounded px-3 py-1 text-sm hover:bg-blue-600"><i class="fa fa-download mr-1"></i>Exporter PNG</button>
      </div>
      <div id="predictionsContainer" class="px-5 pb-3"></div>
    </div>
  </div>

  <script src="JS/dashboard.js" type="module"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</body>
</html>
