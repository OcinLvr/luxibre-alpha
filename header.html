<!-- MODALE LOGIN/SIGNUP AVEC TOUTES LES OPTIONS -->
<div id="authModal" class="hidden fixed inset-0 bg-black bg-opacity-70 z-[9999] flex items-center justify-center">
  <div class="modal-content bg-white dark:bg-slate-800 rounded-xl shadow-lg p-8 max-w-md w-full relative text-gray-900 dark:text-gray-100">
    <button id="closeAuthModal" class="absolute top-3 right-4 text-2xl text-gray-400 hover:text-green-600" aria-label="Fermer">&times;</button>
    <h2 id="authTitle" class="text-2xl font-bold mb-4 text-green-600 dark:text-green-400">Connexion</h2>

    <div class="flex flex-col space-y-2 mb-4">
      <button type="button" id="googleAuthBtn"
        class="bg-white border border-gray-300 dark:bg-slate-700 dark:border-slate-600 flex items-center justify-center gap-2 py-2 rounded-lg shadow hover:bg-gray-50 dark:hover:bg-slate-600 focus:outline-none">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="w-5 h-5">
        <span class="text-gray-700 dark:text-gray-200 font-medium">Continuer avec Google</span>
      </button>
    </div>

    <div class="flex items-center gap-2 mb-3">
      <div class="flex-1 border-t border-gray-200 dark:border-slate-500"></div>
      <span class="text-xs text-gray-400 dark:text-gray-500">ou avec email</span>
      <div class="flex-1 border-t border-gray-200 dark:border-slate-500"></div>
    </div>

    <form id="authForm" autocomplete="on" class="space-y-4">
      <div>
        <input id="authEmail" type="email" required autocomplete="email"
          placeholder="Adresse email"
          class="w-full px-4 py-2 border rounded-lg dark:bg-slate-700 dark:border-slate-600 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-green-400"/>
        <div id="emailError" class="text-xs text-red-600 mt-1"></div>
      </div>
      <div class="relative">
        <input id="authPassword" type="password" required autocomplete="current-password"
          placeholder="Mot de passe"
          class="w-full px-4 py-2 border rounded-lg dark:bg-slate-700 dark:border-slate-600 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-green-400 pr-10"/>
        <button type="button" id="togglePwd" tabindex="-1"
          class="absolute top-1/2 right-3 -translate-y-1/2 text-gray-400 hover:text-green-600 focus:outline-none"
          aria-label="Afficher/Masquer le mot de passe">
          <i class="fa fa-eye"></i>
        </button>
        <div id="passwordError" class="text-xs text-red-600 mt-1"></div>
      </div>
      <div class="flex justify-between items-center">
        <span></span>
        <a href="#" id="forgotPwdLink" class="text-green-600 hover:underline text-sm">Mot de passe oublié ?</a>
      </div>
      <div id="authExtra" class="text-sm text-gray-600 dark:text-gray-300"></div>
      <button type="submit" id="authSubmitBtn"
        class="w-full bg-green-600 text-white py-2 rounded-lg font-bold hover:bg-green-700 transition flex items-center justify-center gap-2">
        <span id="authSubmitText">Se connecter</span>
        <svg id="authLoader" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
      </button>
    </form>
    <div class="mt-4 text-center text-sm">
      <span id="switchAuthMode" class="text-green-600 hover:underline cursor-pointer"></span>
    </div>
    <div id="authError" class="text-red-500 mt-2 text-sm text-center"></div>
  </div>
</div>
